<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Web Simulator</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div class="app-container">

        <header class="app-header">
            <h2>Artha Sanchaar</h2>
            <div id="user-profile-badge" class="hidden">
                <span id="display-vpa">user@upi</span>
            </div>
        </header>

        <section id="auth-section" class="card">
            <h3>Create UPI Account</h3>
            <!-- action tells the browser where should i send the form submission -->
             <!-- will change this action later on according to routing path like /register -->
              <!-- no action,neither method as no we are handling this with backend -->
            <form id="registration-form" >
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="fullName" placeholder="Enter Your Name" required>
                </div>

                <div class="form-group">
                    <label for="mobile-number">Mobile Number</label>
                    <input type="tel" id="mobile-number" name="mobileNumber" placeholder="XXXXXXXXXX(Enter your 10 digit mobile number)" required>
                </div>

                <div class="form-group">
                    <label for="select-bank">Link Bank Account</label>
                    <select id="select-bank" name="bankName" required>
                        <option value="" disabled selected>Select your bank</option>
                        <option value="HDFC">HDFC Bank</option>
                        <option value="SBI">State Bank of India</option>
                        <option value="ICICI">ICICI Bank</option>
                        <option value="AXIS">Axis Bank</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="custom-vpa">Create UPI ID (VPA)</label>
                    <div class="vpa-input-group">
                        <input type="text" id="custom-vpa" name="vpaHandle" placeholder="username" required>
                        <span class="vpa-suffix">@arthasanchar</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="upi-pin">Set 4-Digit UPI PIN</label>
                    <input type="password" id="upi-pin" name="upiPin" maxlength="4" pattern="\d{4}" placeholder="****" required>
                </div>

                <button type="submit" class="btn btn-primary">  Register & Link Account </button>
            </form>
        </section>
    </div>
<script src="js/app.js"></script>

</body>
</html>
