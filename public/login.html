<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTHA SANCHAR - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="brand-header">
            <div class="logo-icon">₹</div>
            <h1>ARTHA SANCHAR</h1>
            <p>Connecting Money,Connecting People</p>
        </div>

        <div class="card">
            <h3>Login to Your Account</h3>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="login-id">Registered Mobile or UPI ID</label>
                    <input 
                        type="text" 
                        id="login-id" 
                        name="loginId" 
                        placeholder="e.g. 9876543210 or user@arthasanchar" 
                        required>
                </div>

                <div class="form-group">
                    <label for="login-pin">4-Digit UPI PIN</label>
                    <input 
                        type="password" 
                        id="login-pin" 
                        name="upiPin" 
                        maxlength="4" 
                        pattern="\d{4}" 
                        placeholder="••••" 
                        required>
                </div>

                <div class="form-actions">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me" name="rememberMe"> Remember Me
                    </label>
                    <a href="#" class="forgot-link">Forgot PIN?</a>
                </div>

                <button type="submit" class="btn btn-primary">Login to Dashboard</button>
            </form>

            <div class="card-footer">
                <p>New to Artha Sanchar? <a href="index.html">Create an Account</a></p>
            </div>
        </div>
    </div>
<script src="js/app.js"></script>

</body>

</html>
