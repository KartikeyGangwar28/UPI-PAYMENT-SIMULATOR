<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastPay UPI - Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Header / Navbar -->
        <header class="navbar">
            <div class="user-info">
                <div class="avatar">AG</div>
                <div>
                    <h4 id="user-display-name">Aditya</h4>
                    <p id="user-display-vpa">adi@arthasanchar</p>
                </div>
            </div>
            <a href="login.html" class="logout-btn">Logout</a>
        </header>

        <!-- Balance Card -->
        <div class="balance-card">
            <div class="balance-header">
                <span>Primary Account</span>
                <span class="bank-tag" id="bank-name">HDFC Bank</span>
            </div>
            <h1 id="account-balance">₹ 45,230.50</h1>
            <p class="account-number">A/C No: •••• 8912</p>
        </div>

        <!-- Quick Actions Navigation -->
        <div class="quick-actions">
            <div class="action-item">
                <button id="btn-send" class="icon-btn active">💸</button>
                <span>Send</span>
            </div>
            <div class="action-item">
                <button id="btn-request" class="icon-btn">📥</button>
                <span>Request</span>
            </div>
            <div class="action-item">
                <button id="btn-scan" class="icon-btn">📷</button>
                <span>Scan QR</span>
            </div>
            <div class="action-item">
                <button id="btn-passbook" class="icon-btn">📊</button>
                <span>Passbook</span>
            </div>
        </div>

        <!-- 1. Send Money / Quick Transfer Section -->
        <div id="section-send" class="section-card">
            <h3>Quick Transfer</h3>
            <form id="transfer-form">
                <div class="form-group">
                    <label for="payee-vpa">Payee UPI ID</label>
                    <input type="text" id="payee-vpa" name="payeeVpa" placeholder="recipient@arthasanchar" required>
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" name="amount" min="1" max="100000" placeholder="0.00" required>
                    </div>
                    <div class="form-group flex-1">
                        <label for="pin">UPI PIN</label>
                        <input type="password" id="pin" name="upiPin" maxlength="4" pattern="\d{4}" placeholder="••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success">Pay Now</button>
            </form>
        </div>

        <!-- 2. Request Money Section -->
        <div id="section-request" class="section-card hidden">
            <h3>Request Money</h3>
            <form id="request-form">
                <div class="form-group">
                    <label for="req-vpa">Payer UPI ID / Mobile</label>
                    <input type="text" id="req-vpa" placeholder="e.g. xyz@arthasanchar" required>
                </div>
                <div class="form-group">
                    <label for="req-amount">Amount (₹)</label>
                    <input type="number" id="req-amount" placeholder="0.00" min="1" required>
                </div>
                <button type="submit" class="btn btn-success">Send Payment Request</button>
            </form>
        </div>

        <!-- 3. Scan QR Code Section -->
        <div id="section-scan" class="section-card hidden">
            <h3>Scan QR Code</h3>
            <div class="qr-box">
                <div class="qr-placeholder">📷 QR Code Reader</div>
                <button type="button" id="sim-scan-btn" class="btn btn-success">Simulate Merchant QR Scan</button>
            </div>
        </div>

        <!-- 4. Passbook / Recent Transactions Section -->
        <div id="section-passbook" class="section-card">
            <h3>Recent Transactions</h3>
            <div class="txn-list" id="txn-history">
                <!-- Dynamically populated by app.js -->
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
